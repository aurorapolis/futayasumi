<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C6E8C">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>ふたやすみ</title>
<style>
  :root{
    --sky-top: #8ED1FC;
    --sky-mid: #BEE3FA;
    --sky-bottom: #E9F6FF;
    --ground-1: #1C6E8C;
    --ground-2: #0E3A4C;
    --sun-color: #FFF6D8;
    --sun-glow: rgba(255,236,168,0.9);
    --sun-glow-soft: rgba(255,236,168,0.35);
    --haze: rgba(255,235,205,0.0);
    --mtn-sky-grad: linear-gradient(to bottom, #8ED1FC, #93a8bd);
    --snow-amount: 0;
    --cloud-tint: rgba(255,255,255,0.75);
    --cloud-glow: transparent;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
  html,body{margin:0; height:100%; overflow:hidden; background:#050309; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;}
  #stage{
    position:fixed; inset:0;
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-bottom) 62%, var(--ground-1) 62%, var(--ground-2) 100%);
    transition: background 2s ease;
    overflow:hidden;
  }
  #haze{
    position:absolute; left:0; right:0; top:44%; height:18%; z-index:1;
    background: linear-gradient(to bottom, var(--sky-mid), var(--haze-solid) 55%, var(--sky-bottom));
    filter: blur(24px);
    pointer-events:none; transition: background 2s ease;
  }
  body.mode-mountain #stage{
    background: var(--mtn-sky-grad);
  }

  /* 太陽 */
  #sun-wrap{ position:absolute; z-index:2; transform:translate(-50%,-50%); transition:opacity 3.5s ease; }
  #sun-corona{
    position:absolute; left:50%; top:50%; width:22vmin; height:22vmin;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle, var(--sun-glow-soft) 0%, transparent 70%);
    filter: blur(2px);
    transition: background 2s ease;
    animation: pulse 6s ease-in-out infinite;
  }
  #sun{
    position:absolute; left:50%; top:50%; width:10vmin; height:10vmin; border-radius:50%;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle at 38% 35%, #fff, var(--sun-color) 55%, var(--sun-glow) 100%);
    box-shadow: 0 0 4vmin 1.2vmin var(--sun-glow);
    transition: background 2s ease, box-shadow 2s ease;
  }
  @keyframes pulse{ 0%,100%{opacity:.85; transform:translate(-50%,-50%) scale(1);} 50%{opacity:1; transform:translate(-50%,-50%) scale(1.08);} }

  /* 月(海・山の夜) */
  #moon-wrap{ position:absolute; z-index:2; transform:translate(-50%,-50%); opacity:0; transition:opacity 4s ease; }
  #moon-glow{
    position:absolute; left:50%; top:50%; width:16vmin; height:16vmin; transform:translate(-50%,-50%);
    background: radial-gradient(circle, rgba(210,220,240,0.35) 0%, transparent 70%);
    filter: blur(2px);
  }
  #moon-svg{
    position:absolute; left:50%; top:50%; width:7.5vmin; height:7.5vmin; transform:translate(-50%,-50%);
    filter: drop-shadow(0 0 1.6vmin rgba(210,220,240,0.55));
  }

  /* 海 */
  #scene-ocean{position:absolute; inset:0; z-index:3; opacity:0; transition:opacity 1s ease; pointer-events:none; overflow:hidden;}
  #scene-ocean.active{opacity:1;}
  #ocean-stars{
    position:absolute; left:0; right:0; top:0; height:60%; overflow:hidden;
    pointer-events:none; opacity:0; transition:opacity 3s ease;
  }
  #ocean-stars .star{ position:absolute; background:#fff; border-radius:50%; animation:twinkleFaint 4s ease-in-out infinite; }
  @keyframes twinkleFaint{ 0%,100%{opacity:.08;} 50%{opacity:.55;} }
  #water{
    position:absolute; left:0; right:0; top:62%; bottom:0; overflow:hidden;
    background: linear-gradient(to bottom, var(--ground-1), var(--ground-2));
    transition: background 2s ease;
  }
  #horizon-glint{
    position:absolute; left:0; right:0; top:0; height:2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55) 45%, rgba(255,255,255,0.55) 55%, transparent);
    opacity:.6;
  }
  #water-surface{ position:absolute; inset:0; filter:url(#water-distort); animation: bob 8s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(0.8%);} }
  .foam{
    position:absolute; border-radius:50%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.5), transparent 70%);
    filter: blur(3px);
    animation: foamPulse 5s ease-in-out infinite;
  }
  @keyframes foamPulse{ 0%,100%{ opacity:.3; } 50%{ opacity:.75; } }
  #reflection{
    position:absolute; top:0; bottom:0; left:50%; width:30vmin; transform:translateX(-50%);
    clip-path: polygon(47% 0%, 53% 0%, 100% 100%, 0% 100%);
    transition: opacity 2s ease;
  }
  #reflection-glow{
    position:absolute; inset:0;
    background: linear-gradient(to bottom, var(--sun-glow) 0%, transparent 92%);
    opacity:.5; filter: blur(2px);
  }
  .refl-seg{ position:absolute; left:50%; border-radius:50%; background:var(--sun-glow); filter:blur(.4px); transform:translateX(-50%); animation: shimmer 2.2s ease-in-out infinite; }
  @keyframes shimmer{ 0%,100%{ opacity:.85; } 50%{ opacity:.15; } }
  .glint{ position:absolute; border-radius:50%; background:rgba(255,255,255,0.9); animation: glintFlicker 2.6s ease-in-out infinite; }
  @keyframes glintFlicker{ 0%,100%{ opacity:0;} 50%{ opacity:1;} }

  /* 山 */
  #scene-mountain{position:absolute; inset:0; z-index:3; opacity:0; transition:opacity 1s ease; pointer-events:none;}
  #scene-mountain.active{opacity:1;}
  #scene-mountain svg{position:absolute; bottom:0; width:100%;}
  .ridge-far{ height:40%; }
  .ridge-mid{ height:36%; }
  .ridge-near{ height:30%; }
  .ridge-far polygon, .ridge-mid polygon, .ridge-near polygon{
    stroke-linejoin: round; stroke-width: 10;
  }
  .ridge-far polygon{ fill: url(#ridge-far-grad); stroke: var(--ridge-far); transition: stroke 2s ease; }
  .ridge-mid polygon{ fill: url(#ridge-mid-grad); stroke: var(--ridge-mid); transition: stroke 2s ease; }
  .ridge-near polygon{ fill: url(#ridge-near-grad); stroke: var(--ridge-near); transition: stroke 2s ease; }
  .snowcap{ opacity:var(--snow-amount, 0); transition: opacity 2.5s ease; }
  .ridge-far polygon.snowcap, .ridge-mid polygon.snowcap, .ridge-near polygon.snowcap{ fill:#f5f8fc; }
  #mtn-haze{ display:none; }
  #mtn-stars{
    position:absolute; left:0; right:0; top:0; height:58%; overflow:hidden;
    pointer-events:none; opacity:0; transition:opacity 3s ease;
  }
  #mtn-stars .star{ position:absolute; background:#fff; border-radius:50%; animation:twinkle 3.5s ease-in-out infinite; }
  #mtn-clouds{
    position:absolute; left:0; right:0; top:0; height:56%; overflow:hidden;
    pointer-events:none;
  }
  .mtn-cloud{
    position:absolute; display:flex; align-items:center; opacity:0;
    transition: opacity 3s ease;
  }
  .mtn-cloud.show{ opacity:var(--cloud-max-opacity, .8); }
  .mtn-cloud span{
    position:absolute; border-radius:50%;
    background:radial-gradient(ellipse at center, var(--cloud-tint, rgba(255,255,255,0.75)) 0%, var(--cloud-tint, rgba(255,255,255,0.75)) 25%, transparent 72%);
    filter:blur(var(--cloud-blur, 9px));
    transition: background .8s ease, box-shadow .8s ease;
    box-shadow: 0 0 14px var(--cloud-glow, transparent);
  }

  /* 宇宙 */
  #scene-space{position:absolute; inset:0; z-index:1; opacity:0; transition:opacity 1s ease; pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%, #241a3d 0%, #0a0716 55%, #050309 100%); overflow:hidden;}
  #scene-space.active{opacity:1;}
  #scene-space .star{position:absolute; background:#fff; border-radius:50%; animation:twinkle 3.5s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.2;} 50%{opacity:1;}}
  .nebula{ position:absolute; border-radius:50%; filter:blur(30px); opacity:.35; animation:drift 150s ease-in-out infinite; }
  @keyframes drift{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(5%,-3.5%) scale(1.1);} }
  .shooting-star{ position:absolute; width:46px; height:2px; opacity:0; transform-origin:left center;
    background:linear-gradient(to left, rgba(255,255,255,0.95), rgba(255,255,255,0)); }
  .shooting-star.go{ animation: shoot 1.1s ease-out forwards; }
  @keyframes shoot{
    0%{ opacity:1; transform: rotate(var(--ang)) translateX(0); }
    100%{ opacity:0; transform: rotate(var(--ang)) translateX(var(--len)); }
  }

  body.mode-space #haze{ display:none; }

  /* 選択UI */
  #picker{
    position:fixed; left:0; right:0; bottom:max(22px, env(safe-area-inset-bottom)); z-index:10;
    display:flex; justify-content:center; gap:26px;
    transition: opacity .5s ease;
  }
  #picker.hidden{ opacity:0; pointer-events:none; }
  .pick-btn{
    width:52px; height:52px; border-radius:50%; border:1px solid rgba(255,255,255,0.35);
    background:rgba(20,20,30,0.28); backdrop-filter:blur(6px);
    color:#fff; display:flex; align-items:center; justify-content:center;
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .pick-btn svg{ width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .pick-btn.selected{ background:rgba(255,255,255,0.9); color:#111; transform:scale(1.08); border-color:transparent;}

  /* パソコンなど広い画面のときだけ、ボタン類を大きくする(スマホの大きさはそのまま) */
  @media (min-width: 700px), (pointer: fine) and (hover: hover){
    #picker{ gap:40px; bottom:max(36px, env(safe-area-inset-bottom)); }
    .pick-btn{ width:92px; height:92px; }
    .pick-btn svg{ width:40px; height:40px; }
    .install-circle{ width:96px; height:96px; }
    .install-circle svg{ width:40px; height:40px; }
    .install-label{ font-size:14px; }
    #install-tip{ font-size:15px; padding:14px 18px; }
  }

  /* 省電力:表示していないシーンのアニメーションは止める */
  #scene-ocean:not(.active) *,
  #scene-mountain:not(.active) *,
  #scene-space:not(.active) *{
    animation-play-state: paused !important;
  }

  /* OSの「動きを減らす」設定を尊重し、装飾アニメーションを控えめにする */
  @media (prefers-reduced-motion: reduce){
    .glint, .refl-seg, .foam, .star, .nebula, #sun-corona, .win-light{
      animation: none !important;
    }
    #water-surface{ animation: none !important; }
  }

  #install-menu{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(0.9); z-index:20;
    display:none; align-items:center; gap:20px;
    opacity:0; transition:opacity .2s ease, transform .2s ease;
  }
  #install-menu.show{ display:flex; opacity:1; transform:translate(-50%,-50%) scale(1); }
  .install-circle{
    width:56px; height:56px; border-radius:50%; border:1px solid rgba(255,255,255,0.3);
    background:rgba(20,20,30,0.6); backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  .install-circle svg{ width:24px; height:24px; stroke:#fff; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #install-menu-close svg{ stroke:rgba(255,255,255,0.75); }
  .install-label{
    position:absolute; left:50%; top:100%; transform:translateX(-50%); margin-top:8px;
    font-size:10.5px; color:rgba(255,255,255,0.75); white-space:nowrap;
  }
  #install-tip{
    position:fixed; left:50%; bottom:calc(50% + 62px); transform:translateX(-50%);
    max-width:min(74vw, 280px); z-index:21;
    background:rgba(20,20,30,0.75); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.25); border-radius:12px;
    padding:9px 12px; color:#fff; font-size:12px; line-height:1.5; text-align:center;
    display:none; opacity:0; transition:opacity .2s ease;
  }
  #install-tip.show{ display:block; opacity:1; }
  #install-menu-backdrop{
    position:fixed; inset:0; z-index:19; display:none; background:rgba(0,0,0,0.15);
  }
  #install-menu-backdrop.show{ display:block; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="water-distort" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" values="0.010 0.045;0.017 0.058;0.010 0.045" dur="13s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="ridge-far-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--ridge-far-soft, var(--ridge-far))"/>
      <stop offset="35%" stop-color="var(--ridge-far)"/>
      <stop offset="100%" stop-color="var(--ridge-far)"/>
    </linearGradient>
    <linearGradient id="ridge-mid-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--ridge-mid-soft, var(--ridge-mid))"/>
      <stop offset="35%" stop-color="var(--ridge-mid)"/>
      <stop offset="100%" stop-color="var(--ridge-mid)"/>
    </linearGradient>
    <linearGradient id="ridge-near-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--ridge-near-soft, var(--ridge-near))"/>
      <stop offset="35%" stop-color="var(--ridge-near)"/>
      <stop offset="100%" stop-color="var(--ridge-near)"/>
    </linearGradient>
  </defs>
</svg>

<div id="stage">
  <div id="haze"></div>

  <div id="scene-ocean">
    <div id="ocean-stars"></div>
    <div id="water">
      <div id="horizon-glint"></div>
      <div id="water-surface">
        <div id="reflection">
          <div id="reflection-glow"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="scene-mountain">
    <div id="mtn-stars"></div>
    <div id="mtn-clouds"></div>
    <svg class="ridge-far" viewBox="0 0 400 160" preserveAspectRatio="none">
      <polygon points="0,160 0,110 70,60 140,115 200,75 260,120 330,80 400,110 400,160"/>
      <polygon class="snowcap" points="70,60 58,78 82,78"/>
      <polygon class="snowcap" points="200,75 190,90 210,90"/>
      <polygon class="snowcap" points="330,80 320,95 340,95"/>
    </svg>
    <svg class="ridge-mid" viewBox="0 0 400 160" preserveAspectRatio="none">
      <polygon points="0,160 0,95 60,45 120,105 180,60 245,115 300,65 360,105 400,85 400,160"/>
      <polygon class="snowcap" points="60,45 47,64 73,64"/>
      <polygon class="snowcap" points="180,60 168,78 192,78"/>
      <polygon class="snowcap" points="300,65 289,81 311,81"/>
    </svg>
    <svg class="ridge-near" viewBox="0 0 400 160" preserveAspectRatio="none">
      <polygon points="0,160 0,120 80,70 150,120 220,80 300,130 400,100 400,160"/>
      <polygon class="snowcap" points="80,70 67,90 93,90"/>
      <polygon class="snowcap" points="220,80 209,96 231,96"/>
    </svg>
  </div>

  <div id="scene-space"></div>

  <div id="moon-wrap">
    <div id="moon-glow"></div>
    <svg id="moon-svg" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="moon-fill" cx="40%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#f4f6fb"/>
          <stop offset="55%" stop-color="#d7dde8"/>
          <stop offset="100%" stop-color="#b9c1d1"/>
        </radialGradient>
        <clipPath id="moon-clip"><path id="moon-clip-path" d=""/></clipPath>
      </defs>
      <circle cx="50" cy="50" r="47" fill="#3a3f4d" opacity="0.28"/>
      <g clip-path="url(#moon-clip)">
        <circle cx="50" cy="50" r="47" fill="url(#moon-fill)"/>
        <circle cx="38" cy="34" r="7" fill="rgba(150,160,180,0.35)"/>
        <circle cx="61" cy="58" r="5" fill="rgba(150,160,180,0.35)"/>
        <circle cx="45" cy="63" r="3.2" fill="rgba(150,160,180,0.3)"/>
      </g>
    </svg>
  </div>

  <div id="sun-wrap">
    <div id="sun-corona"></div>
    <div id="sun"></div>
  </div>
</div>

<div id="install-menu-backdrop"></div>
<div id="install-tip"></div>
<div id="install-menu">
  <button id="install-add" class="install-circle" aria-label="ホーム画面に追加">
    <svg viewBox="0 0 24 24"><path d="M12 3v13M6 10l6 6 6-6"/><path d="M4 20h16"/></svg>
    <span class="install-label">追加</span>
  </button>
  <button id="install-menu-close" class="install-circle" aria-label="閉じる">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    <span class="install-label">閉じる</span>
  </button>
</div>

<div id="picker">
  <button class="pick-btn" data-scene="ocean" aria-label="海">
    <svg viewBox="0 0 24 24">
      <path d="M3 6.5c1.5-1.6 3-1.6 4.5 0s3 1.6 4.5 0 3-1.6 4.5 0 3 1.6 4.5 0"/>
      <path d="M3 12c1.5-1.6 3-1.6 4.5 0s3 1.6 4.5 0 3-1.6 4.5 0 3 1.6 4.5 0"/>
      <path d="M3 17.5c1.5-1.6 3-1.6 4.5 0s3 1.6 4.5 0 3-1.6 4.5 0 3 1.6 4.5 0"/>
    </svg>
  </button>
  <button class="pick-btn" data-scene="mountain" aria-label="山">
    <svg viewBox="0 0 24 24">
      <path d="M2 18 8.5 6l3.2 5.6L14 8l8 10z"/>
      <path d="M7 9.2 8.5 6l2 3.5" stroke-width="1.3"/>
    </svg>
  </button>
  <button class="pick-btn" data-scene="space" aria-label="宇宙">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="7"/>
      <ellipse cx="12" cy="12" rx="11" ry="3.6" transform="rotate(-18 12 12)" stroke-width="1.1"/>
      <path d="M20 3.7l.85 1.7 1.7.85-1.7.85-.85 1.7-.85-1.7-1.7-.85 1.7-.85z" fill="currentColor" stroke="none"/>
      <path d="M5.5 16.8l.55 1.1 1.1.55-1.1.55-.55 1.1-.55-1.1-1.1-.55 1.1-.55z" fill="currentColor" stroke="none"/>
    </svg>
  </button>
</div>

<script>
(function(){
  const root = document.documentElement;
  const body = document.body;
  const sunWrap = document.getElementById('sun-wrap');
  const moonWrap = document.getElementById('moon-wrap');
  const water = document.getElementById('water-surface');
  const reflection = document.getElementById('reflection');
  const scenes = {
    ocean: document.getElementById('scene-ocean'),
    mountain: document.getElementById('scene-mountain'),
    space: document.getElementById('scene-space')
  };
  const buttons = document.querySelectorAll('.pick-btn');
  const spaceEl = scenes.space;

  const STORAGE_KEY = 'sun-clock-scene';
  let currentScene = 'ocean';
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && scenes[saved]) currentScene = saved;
  } catch(e) {}

  function setScene(name, save){
    currentScene = name;
    Object.entries(scenes).forEach(([k, el]) => el.classList.toggle('active', k === name));
    buttons.forEach(b => b.classList.toggle('selected', b.dataset.scene === name));
    body.classList.toggle('mode-space', name === 'space');
    body.classList.toggle('mode-mountain', name === 'mountain');
    moonWrap.style.display = (name === 'space') ? 'none' : 'block';
    if (save !== false) {
      try { localStorage.setItem(STORAGE_KEY, name); } catch(e) {}
    }
    // 省電力:水面の乱流フィルター(SVG SMILアニメーション)は、海を見ていないときは止める
    try {
      const filterSvgRoot = document.getElementById('water-distort').ownerSVGElement;
      if (filterSvgRoot) {
        if (name === 'ocean') filterSvgRoot.unpauseAnimations();
        else filterSvgRoot.pauseAnimations();
      }
    } catch(e) {}
    // シーン切替の瞬間だけ太陽・月・水面反射のフェードを止めて、前のシーンの明るさが
    // 尾を引いて見えるのを防ぐ(通常の時間経過によるフェードには影響しない)
    sunWrap.style.transition = 'none';
    moonWrap.style.transition = 'none';
    reflection.style.transition = 'none';
    render();
    void sunWrap.offsetHeight;
    requestAnimationFrame(() => {
      sunWrap.style.transition = '';
      moonWrap.style.transition = '';
      reflection.style.transition = '';
    });
  }
  buttons.forEach(b => b.addEventListener('click', () => setScene(b.dataset.scene)));

  // 5秒操作がなければボタンを隠し、画面をタップしたら再表示(スワイプ操作では出さない)
  const picker = document.getElementById('picker');
  let hideTimer = null;
  function showPicker(){
    picker.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => picker.classList.add('hidden'), 3500);
  }

  function lerp(a,b,t){ return a + (b-a)*t; }
  function lerpColor(c1, c2, t){ return [0,1,2].map(i => Math.round(lerp(c1[i], c2[i], t))); }
  function hex(rgb){ return '#' + rgb.map(v => v.toString(16).padStart(2,'0')).join(''); }

  function easeSeg(t){ return t*t*(3 - 2*t); }
  function fineGradient(keyPositions, keyColors, stepPct){
    const stops = [];
    for(let pos=0; pos<=100; pos+=stepPct){
      let seg = keyPositions.length - 2;
      for(let i=0;i<keyPositions.length-1;i++){
        if(pos >= keyPositions[i] && pos <= keyPositions[i+1]){ seg = i; break; }
      }
      const span = keyPositions[seg+1] - keyPositions[seg];
      const local = span === 0 ? 0 : (pos - keyPositions[seg]) / span;
      const c = lerpColor(keyColors[seg], keyColors[seg+1], easeSeg(Math.max(0,Math.min(1,local))));
      stops.push(`${hex(c)} ${pos}%`);
    }
    return `linear-gradient(to bottom, ${stops.join(', ')})`;
  }

  const palettes = {

    const out = {};
    Object.keys(a).forEach(k => out[k] = lerpColor(a[k], b[k], t));
    return out;

  // 山の季節感(月ごとの色味と雪の量。月の変わり目はなだらかに補間)
  const monthTints = [
    [235,240,245], // 1月 冬(白)
    [228,235,242], // 2月 冬(白)
    [150,195,130], // 3月 春(新緑)

  const monthSnow = [1, 0.7, 0.15, 0, 0, 0, 0, 0, 0, 0, 0.05, 0.7];
  function seasonForDate(date){
    const m = date.getMonth();
    const daysInMonth = new Date(date.getFullYear(), m+1, 0).getDate();
    const dayFrac = (date.getDate() - 1 + date.getHours()/24) / daysInMonth;
    const pos = (m + dayFrac - 0.5 + 12) % 12;
    const idx = Math.floor(pos);
    const frac = pos - idx;
    const nextIdx = (idx + 1) % 12;
    return {
      tint: lerpColor(monthTints[idx], monthTints[nextIdx], frac),
      snow: lerp(monthSnow[idx], monthSnow[nextIdx], frac)
    };
  }

  // ---- 太陽位置の天文計算(緯度・経度・日時から高度と方位を求める) ----
  const RAD = Math.PI/180;
  const DAY_MS = 1000*60*60*24;
  const J1970 = 2440588, J2000 = 2451545;
  const OBLIQUITY = RAD*23.4397;

  function toDays(date){ return date.valueOf()/DAY_MS - 0.5 + J1970 - J2000; }
  function rightAscension(l,b){ return Math.atan2(Math.sin(l)*Math.cos(OBLIQUITY) - Math.tan(b)*Math.sin(OBLIQUITY), Math.cos(l)); }
  function declination(l,b){ return Math.asin(Math.sin(b)*Math.cos(OBLIQUITY) + Math.cos(b)*Math.sin(OBLIQUITY)*Math.sin(l)); }
  function solarMeanAnomaly(d){ return RAD*(357.5291 + 0.98560028*d); }
  function eclipticLongitude(M){
    const C = RAD*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M));
    const P = RAD*102.9372;
    return M + C + P + Math.PI;
  }
  function sunEquatorialCoords(d){
    const M = solarMeanAnomaly(d);
    const L = eclipticLongitude(M);
    return { dec: declination(L,0), ra: rightAscension(L,0) };
  }
  function siderealTime(d, lw){ return RAD*(280.16 + 360.9856235*d) - lw; }
  function horizAzimuth(H, phi, dec){ return Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi) - Math.tan(dec)*Math.cos(phi)); }
  function horizAltitude(H, phi, dec){ return Math.asin(Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H)); }

  function getSunAzAlt(date, lat, lng){
    const lw = RAD*-lng, phi = RAD*lat, d = toDays(date);
    const c = sunEquatorialCoords(d);
    const H = siderealTime(d, lw) - c.ra;
    return { azimuth: horizAzimuth(H, phi, c.dec), altitude: horizAltitude(H, phi, c.dec) };
  }
  // 方位(南=0, 西=+90°方向)・高度(水平線=0, 天頂=90°)を画面上の位置に投影
  // 南半球では太陽が北寄りを通るため、見やすいよう基準を反転させる(北=0とみなす)
  function skyPosition(azimuth, altitude, lat){
    const r = 38, cx = 50, cy = 62;
    const adjustedAz = (lat < 0) ? azimuth + Math.PI : azimuth;
    return { x: cx + (adjustedAz/Math.PI)*r, y: cy - (altitude/(Math.PI/2))*r };
  }

  // 月の満ち欠け(既知の新月を基準に、朔望月の周期から位相を求める)
  const SYNODIC_MONTH = 29.530588853; // 日
  const KNOWN_NEW_MOON = Date.UTC(2000, 0, 6, 18, 14, 0);
  function moonPhase(date){
    const days = (date.getTime() - KNOWN_NEW_MOON) / 86400000;
    let phase = (days % SYNODIC_MONTH) / SYNODIC_MONTH;
    if(phase < 0) phase += 1;
    return phase; // 0=新月, 0.25=上弦, 0.5=満月, 0.75=下弦
  }
  function moonPhasePath(cx, cy, r, phase){
    const k = Math.cos(phase * 2 * Math.PI);
    const rx = Math.abs(r * k);
    const waxing = phase < 0.5;
    const outerSweep = waxing ? 1 : 0;
    const termSweep = waxing ? (k >= 0 ? 0 : 1) : (k >= 0 ? 1 : 0);
    return `M ${cx} ${cy-r} A ${r} ${r} 0 0 ${outerSweep} ${cx} ${cy+r} `
         + `A ${rx.toFixed(2)} ${r} 0 0 ${termSweep} ${cx} ${cy-r} Z`;
  }

  // 位置情報:取得できなければ東京を仮の場所として使う
  let userLat = 35.6762, userLon = 139.6503;
  if('geolocation' in navigator){
    navigator.geolocation.getCurrentPosition(
      (pos) => { userLat = pos.coords.latitude; userLon = pos.coords.longitude; render(); },
      () => {},
      { timeout: 8000, maximumAge: 30*60*1000 }
    );
  }

  function render(){
    const now = new Date();
    const sun = getSunAzAlt(now, userLat, userLon);
    const sunP = skyPosition(sun.azimuth, sun.altitude, userLat);
    const sunAltDeg = sun.altitude/RAD;
    const daylight = Math.max(-1, Math.min(1, sunAltDeg/50));

    // 月はおおよそ太陽と天球上で反対側(満月の位置関係の近似)
    let moonAz = sun.azimuth + Math.PI;
    if (moonAz > Math.PI) moonAz -= 2 * Math.PI;
    const moonAlt = -sun.altitude;
    const moonP = skyPosition(moonAz, moonAlt, userLat);
    const moonAltDeg = moonAlt/RAD;
    const moonDaylight = Math.max(-1, Math.min(1, moonAltDeg/50));

    sunWrap.style.left = sunP.x + '%';
    sunWrap.style.top = sunP.y + '%';
    const sunT = Math.max(0, Math.min(1, (sunAltDeg + 6) / 22));
    const sunEase = sunT*sunT*(3 - 2*sunT);
    const sunVisible = (currentScene === 'space') ? 1 : sunEase;
    sunWrap.style.opacity = sunVisible;
    reflection.style.left = sunP.x + '%';
    const glitterIntensity = Math.max(0.16, 1 - Math.sin(Math.max(0, sunAltDeg) * RAD));
    reflection.style.opacity = (currentScene === 'ocean') ? sunVisible * glitterIntensity : 0;

    const starsT = Math.max(0, Math.min(1, (-sunAltDeg - 2) / 16));
    const starsEase = starsT*starsT*(3 - 2*starsT);
    mtnStarsEl.style.opacity = starsEase;
    oceanStarsEl.style.opacity = starsEase;

    moonWrap.style.left = moonP.x + '%';
    moonWrap.style.top = moonP.y + '%';
    const moonT = Math.max(0, Math.min(1, (moonAltDeg + 8) / 30));
    const moonEase = moonT*moonT*(3 - 2*moonT);
    moonWrap.style.opacity = currentScene==='space' ? 0 : moonEase;
    const cloudMoonlit = lerpColor([255,255,255], [200,215,240], moonEase);
    root.style.setProperty('--cloud-tint', `rgba(${cloudMoonlit[0]},${cloudMoonlit[1]},${cloudMoonlit[2]},0.75)`);
    root.style.setProperty('--cloud-glow', `rgba(${cloudMoonlit[0]},${cloudMoonlit[1]},${cloudMoonlit[2]},${(moonEase*0.55).toFixed(2)})`);
    document.getElementById('moon-clip-path').setAttribute('d', moonPhasePath(50, 50, 47, moonPhase(now)));

    const p = blendPalette(daylight);
    const season = seasonForDate(now);
    function applySeason(c, strength){
      let out = lerpColor(c, season.tint, strength);
      out = lerpColor(out, [248,250,253], season.snow*0.35);
      return out;
    }
    const ridgeFarS = applySeason(p.ridgeFar, 0.16);
    const ridgeMidS = applySeason(p.ridgeMid, 0.42);
    const ridgeNearS = applySeason(p.ridgeNear, 0.5);
    root.style.setProperty('--snow-amount', season.snow.toFixed(2));

    root.style.setProperty('--sky-top', hex(p.skyTop));
    root.style.setProperty('--sky-mid', hex(p.skyMid));
    root.style.setProperty('--sky-bottom', hex(p.skyBottom));
    const isMountain = (currentScene === 'mountain');
    root.style.setProperty('--ground-1', hex(isMountain ? ridgeFarS : p.ground1));
    root.style.setProperty('--ground-2', hex(isMountain ? ridgeNearS : p.ground2));
    if(isMountain){
      const mtnGrad = fineGradient(
        [0, 25, 50, 75, 100],
        [p.skyTop, p.skyMid, p.skyBottom, ridgeFarS, ridgeNearS],
        4
      );
      root.style.setProperty('--mtn-sky-grad', mtnGrad);
      root.style.setProperty('--ridge-far-soft', hex(lerpColor(p.skyBottom, ridgeFarS, 0.5)));
      root.style.setProperty('--ridge-mid-soft', hex(lerpColor(ridgeFarS, ridgeMidS, 0.5)));
      root.style.setProperty('--ridge-near-soft', hex(lerpColor(ridgeMidS, ridgeNearS, 0.5)));
    }
    root.style.setProperty('--ridge-far', hex(ridgeFarS));
    root.style.setProperty('--ridge-mid', hex(ridgeMidS));
    root.style.setProperty('--ridge-near', hex(ridgeNearS));
    root.style.setProperty('--sun-color', hex(p.sun));
    root.style.setProperty('--sun-glow', rgba(p.glow,0.85));
    root.style.setProperty('--sun-glow-soft', rgba(p.glow,0.35));
    const hazeAmount = Math.max(0, Math.min(0.55, 0.55 - Math.abs(daylight)*0.45));
    root.style.setProperty('--haze-solid', hex(lerpColor(p.skyMid, p.glow, hazeAmount)));
    root.style.setProperty('--haze', rgba(p.glow, Math.max(0, 0.16 - Math.abs(daylight)*0.14)));
  }

  setScene(currentScene, false);
  render();
  let renderTimer = setInterval(render, 15000);

  // 省電力:バックグラウンド(画面ロック・タブ非表示)のあいだは更新を止める
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearInterval(renderTimer);
    } else {
      render();
      renderTimer = setInterval(render, 15000);
    }
  });

  // オフライン対応(https/localhostで開いた場合のみ有効化)
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  // ホーム画面への追加:自動では出さず、長押しでだけ丸ボタンを2つ出す
  const installMenu = document.getElementById('install-menu');
  const installMenuBackdrop = document.getElementById('install-menu-backdrop');
  const installTip = document.getElementById('install-tip');
  const installAdd = document.getElementById('install-add');
  const installMenuClose = document.getElementById('install-menu-close');

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e; // 長押しされるまでは何も表示しない
  });

  let installHideTimer = null;
  function openInstallMenu(){
    if (isStandalone) return; // すでにホーム画面から起動している場合は出さない
    installMenu.classList.add('show');
    installMenuBackdrop.classList.add('show');
    suppressTapShow = true;
    clearTimeout(installHideTimer);
    installHideTimer = setTimeout(closeInstallMenu, 3500);
  }
  function closeInstallMenu(){
    clearTimeout(installHideTimer);
    installMenu.classList.remove('show');
    installMenuBackdrop.classList.remove('show');
    installTip.classList.remove('show');
  }
  installAdd.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      closeInstallMenu();
    } else {
      // iOSなど直接インストールを呼べない場合は、手順を吹き出しで表示
      installTip.textContent = isIOS
        ? '共有ボタン(□↑)から「ホーム画面に追加」を選ぶと、アプリのように使えます'
        : 'ブラウザのメニューから「ホーム画面に追加」を選ぶと、アプリのように使えます';
      installTip.classList.add('show');
    }
  });
  installMenuClose.addEventListener('click', closeInstallMenu);
  installMenuBackdrop.addEventListener('click', closeInstallMenu);

  // 長押し(約550ms)を検出。スワイプやタップと誤反応しないよう、動きが大きい場合は取り消す
  let pressTimer = null;
  let pressStartX = 0, pressStartY = 0, pressMoved = false;
  function pressStart(x, y){
    pressStartX = x; pressStartY = y; pressMoved = false;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => { if (!pressMoved) openInstallMenu(); }, 550);
  }
  function pressMove(x, y){
    if (Math.abs(x - pressStartX) > 12 || Math.abs(y - pressStartY) > 12) {
      pressMoved = true;
      clearTimeout(pressTimer);
    }
  }
  function pressEnd(){ clearTimeout(pressTimer); }

  document.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    pressStart(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    pressMove(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener('touchend', pressEnd, { passive: true });
  document.addEventListener('mousedown', (e) => pressStart(e.clientX, e.clientY));
  document.addEventListener('mousemove', (e) => { if (pressTimer) pressMove(e.clientX, e.clientY); });
  document.addEventListener('mouseup', pressEnd);
})();
</script>
</body>
</html>
